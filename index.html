.container {
    width: 100%;

    background: rgba(0, 0, 0, 0.45);

    padding: 35px 25px;

    border-radius: 20px;

    backdrop-filter: blur(6px);

   .logo {

.logo img {

}

        }

.button {
    display: block;

    width: 100%;

    padding: 17px;

    margin: 14px 0;

    background: rgba(5, 5, 5, 0.65);

    border: 1px solid #168cff;

    border-radius: 12px;

    color: white;

    text-decoration: none;

    font-size: 16px;

    font-weight: bold;

    letter-spacing: 0.5px;

    transition: all 0.3s ease;
}

.button:hover {
    background: #168cff;

    color: #050505;

    transform: translateY(-2px);

    box-shadow: 0 8px 25px rgba(22, 140, 255, 0.25);
}
        .footer {
            margin-top: 35px;

            font-size: 12px;
        }
@media (max-width: 480px) {

    body {
